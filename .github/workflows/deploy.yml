name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test FTP server reachability
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Resolving $FTP_SERVER..."
          getent hosts "$FTP_SERVER" || echo "DNS resolution failed"
          echo "Testing TCP connection to port 21..."
          timeout 10 bash -c "</dev/tcp/$FTP_SERVER/21" && echo "Port 21: reachable" || echo "Port 21: NOT reachable"
          echo "Testing TCP connection to port 990 (implicit FTPS)..."
          timeout 10 bash -c "</dev/tcp/$FTP_SERVER/990" && echo "Port 990: reachable" || echo "Port 990: NOT reachable"

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp << LFTP_EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          debug 3
          open -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER"
          pwd
          mirror --reverse --delete --parallel=2 --verbose \
            --exclude-glob .git* \
            --exclude-glob README.md \
            --exclude-glob CLAUDE.md \
            --exclude-glob node_modules \
            --exclude-glob dist \
            --exclude-glob .astro \
            --exclude-glob .DS_Store \
            . .
          bye
          LFTP_EOF
